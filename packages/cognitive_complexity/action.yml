name: 'Dart Cognitive Complexity Audit'
description: 'Deterministic Cognitive Complexity calculator and Git diff regression scanner for Dart and Flutter repositories.'
author: 'kevmoo'

branding:
  icon: 'trending-up'
  color: 'blue'

inputs:
  targets:
    description: 'Space-separated list of target files or directories to analyze.'
    required: false
    default: 'lib'
  threshold:
    description: 'Minimum complexity score to display in reports.'
    required: false
    default: '0'
  fail-threshold:
    description: 'Exit with non-zero status if any function score exceeds this ceiling.'
    required: false
    default: '15'
  max-file-lines:
    description: 'Opt-in maximum physical lines per source file (empty or 0 = disabled by default).'
    required: false
    default: ''
  max-function-lines:
    description: 'Opt-in maximum lines per function/method declaration (empty or 0 = disabled by default).'
    required: false
    default: ''
  diff-base:
    description: 'Git ref (e.g. origin/main) to compare against. Auto-detects PR base by default.'
    required: false
    default: ''
  fail-on-increase:
    description: 'Exit with non-zero status if any function increased in complexity over diff-base.'
    required: false
    default: 'false'
  format:
    description: 'Output format: github (summary table + annotations), text, or json.'
    required: false
    default: 'github'
  max-comment-rows:
    description: >-
      Maximum table rows in the sticky PR comment, most significant first
      (0 = unlimited). The step summary always keeps the full table. GitHub
      rejects comment bodies over 65536 characters, so an uncapped table on a
      large diff fails to post.
    required: false
    default: '0'

runs:
  using: 'composite'
  steps:
    - name: Resolve Diff Base & Fetch History
      id: prepare
      shell: bash
      env:
        INPUT_DIFF_BASE: ${{ inputs.diff-base }}
        EVENT_NAME: ${{ github.event_name }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        diff_arg=""
        base="$INPUT_DIFF_BASE"
        if [ -z "$base" ]; then
          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "pull_request_target" ]; then
            base="origin/$BASE_REF"
          fi
        fi
        if [ -n "$base" ]; then
          echo "Fetching Git object history for diff base $base..."
          git fetch origin "${base#origin/}" 2>/dev/null || true
          diff_arg="--git-diff=$base"
        fi
        echo "diff_arg=$diff_arg" >> "$GITHUB_OUTPUT"

    - name: Execute Cognitive Complexity Scanner
      shell: bash
      env:
        INPUT_THRESHOLD: ${{ inputs.threshold }}
        INPUT_FAIL_THRESHOLD: ${{ inputs.fail-threshold }}
        INPUT_MAX_FILE_LINES: ${{ inputs.max-file-lines }}
        INPUT_MAX_FUNCTION_LINES: ${{ inputs.max-function-lines }}
        INPUT_FAIL_ON_INCREASE: ${{ inputs.fail-on-increase }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_TARGETS: ${{ inputs.targets }}
        INPUT_MAX_COMMENT_ROWS: ${{ inputs.max-comment-rows }}
        DIFF_ARG: ${{ steps.prepare.outputs.diff_arg }}
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        fail_inc_arg=""
        if [ "$INPUT_FAIL_ON_INCREASE" = "true" ]; then
          fail_inc_arg="--fail-on-increase"
        fi

        line_args=()
        if [ -n "$INPUT_MAX_FILE_LINES" ] && [ "${INPUT_MAX_FILE_LINES:-0}" -gt 0 ] 2>/dev/null; then
          line_args+=(--max-file-lines="$INPUT_MAX_FILE_LINES")
        fi
        if [ -n "$INPUT_MAX_FUNCTION_LINES" ] && [ "${INPUT_MAX_FUNCTION_LINES:-0}" -gt 0 ] 2>/dev/null; then
          line_args+=(--max-function-lines="$INPUT_MAX_FUNCTION_LINES")
        fi

        case "${INPUT_MAX_COMMENT_ROWS:-0}" in
          ''|*[!0-9]*)
            echo "::error::max-comment-rows must be a non-negative integer, got '${INPUT_MAX_COMMENT_ROWS}'."
            exit 1
            ;;
        esac

        # Absolute path so it is independent of the scanner's cwd.
        # An array keeps the path intact even if RUNNER_TEMP contains spaces.
        # Only request a comment when one could actually be posted: the CLI
        # warns about --comment-output outside github+diff mode, which made
        # push-triggered runs noisier than before.
        comment_file="${RUNNER_TEMP}/complexity-comment.md"
        comment_args=()
        if [ "$INPUT_FORMAT" = "github" ] && [ -n "$DIFF_ARG" ]; then
          comment_args+=(--comment-output="$comment_file")
          if [ "${INPUT_MAX_COMMENT_ROWS:-0}" -gt 0 ]; then
            comment_args+=(--max-comment-rows="$INPUT_MAX_COMMENT_ROWS")
          fi
        fi

        # Auto-detect monorepos when default 'lib' target does not exist in caller workspace
        workspace="${GITHUB_WORKSPACE:-$PWD}"
        targets="$INPUT_TARGETS"
        if [ "$targets" = "lib" ] && [ ! -d "$workspace/lib" ] && [ -d "$workspace/packages" ]; then
          targets="packages"
        fi

        # Resolve the scanner's dependencies inside the action checkout, but
        # run it from the caller's workspace.
        (cd "$ACTION_PATH" && dart pub get >/dev/null)
        cd "$workspace"

        # The absence of this file is how the CLI signals "clean", so a stale
        # copy from an earlier invocation in the same job must not survive.
        rm -f "$comment_file"

        # Execute the scanner CLI tool and capture exit code
        set +e
        dart run "$ACTION_PATH/bin/cognitive_complexity.dart" \
          --threshold="$INPUT_THRESHOLD" \
          --fail-threshold="$INPUT_FAIL_THRESHOLD" \
          --format="$INPUT_FORMAT" \
          $DIFF_ARG \
          $fail_inc_arg \
          "${line_args[@]}" \
          "${comment_args[@]}" \
          $targets
        exit_code=$?
        set -e

        # If running inside a PR context and GH_TOKEN is present, post or update sticky comment
        if [ -n "$PR_NUMBER" ] && [ -n "$GH_TOKEN" ] && [ "$INPUT_FORMAT" = "github" ]; then
          echo "Searching for existing complexity audit comment on PR #$PR_NUMBER..."
          # Never let a transient API failure fail the step: the lookup now runs
          # on clean runs too, so an unguarded non-zero exit under `set -e`
          # would skip `exit $exit_code` and mask the real result.
          comment_ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | contains("<!-- complexity-comment-marker -->")) | .id' 2>/dev/null || true)
          comment_id=$(printf '%s\n' "$comment_ids" | head -n 1)

          if [ -f "$comment_file" ] && [ -s "$comment_file" ]; then
            if [ -n "$comment_id" ]; then
              echo "Updating existing comment (ID: $comment_id)..."
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -F body=@"$comment_file" > /dev/null || true
            else
              echo "Creating new PR comment..."
              gh pr comment "$PR_NUMBER" --body-file "$comment_file" --repo "$GITHUB_REPOSITORY" > /dev/null || true
            fi
          elif [ "$exit_code" -eq 0 ] && [ -n "$comment_id" ]; then
            # Only a successful run proves the diff is clean. A crash also
            # leaves no comment file, and must not be reported as resolved.
            echo "Run is clean. Patching existing comment to resolved status..."
            resolved_file="${RUNNER_TEMP}/resolved-complexity-comment.md"
            # GITHUB_SHA is the ephemeral refs/pull/N/merge commit on
            # pull_request events, which is not reachable in the branch.
            sha="${HEAD_SHA:-${GITHUB_SHA:-unknown}}"
            {
              echo "<!-- complexity-comment-marker -->"
              echo "# 📊 Cognitive Complexity Analysis"
              echo
              echo "> [!TIP]"
              echo "> **Status:** Clean - no complexity regressions in the current diff."
              echo
              echo "_Last checked: ${sha:0:7} ([run](${GITHUB_SERVER_URL:-https://github.com}/$GITHUB_REPOSITORY/actions/runs/${GITHUB_RUN_ID:-0}))._"
            } > "$resolved_file"
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -F body=@"$resolved_file" > /dev/null || true
          fi
        fi

        exit $exit_code
