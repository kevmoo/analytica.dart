name: 'Dart Dependency Lower-Bound Validator'
description: 'Automated Dart dependency lower-bound validator and synthetic runtime isolation engine.'
author: 'kevmoo'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  targets:
    description: 'Comma-separated list of target directories or files to analyze in staging.'
    required: false
    default: 'lib,bin'
  allow-local-siblings:
    description: 'Allow unreleased local sibling packages via path overrides.'
    required: false
    default: 'false'
  sdk:
    description: 'Simulate specific Dart SDK version during pub resolution.'
    required: false
    default: ''
  fail-on-error:
    description: 'Exit with non-zero status if lower bound validation fails.'
    required: false
    default: 'true'
  format:
    description: 'Output format: github (summary table + annotations), text, or json.'
    required: false
    default: 'github'
  max-comment-rows:
    description: >-
      Maximum table rows in the sticky PR comment, most significant first
      (0 = unlimited). The step summary always keeps the full table. GitHub
      rejects comment bodies over 65536 characters, so an uncapped table fails
      to post on large repositories.
    required: false
    default: '0'
  package-path:
    description: 'Path to target package or workspace root to validate (defaults to workspace root).'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Execute Lower-Bound Validator
      shell: bash
      env:
        INPUT_TARGETS: ${{ inputs.targets }}
        INPUT_ALLOW_LOCAL_SIBLINGS: ${{ inputs.allow-local-siblings }}
        INPUT_SDK: ${{ inputs.sdk }}
        INPUT_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_MAX_COMMENT_ROWS: ${{ inputs.max-comment-rows }}
        INPUT_PACKAGE_PATH: ${{ inputs.package-path }}
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        case "${INPUT_MAX_COMMENT_ROWS:-0}" in
          ''|*[!0-9]*)
            echo "::error::max-comment-rows must be a non-negative integer, got '${INPUT_MAX_COMMENT_ROWS}'."
            exit 1
            ;;
        esac

        run_args=(
          "--targets=$INPUT_TARGETS"
          "--format=$INPUT_FORMAT"
        )

        if [ "$INPUT_ALLOW_LOCAL_SIBLINGS" = "true" ]; then
          run_args+=("--allow-local-siblings")
        fi

        if [ -n "$INPUT_SDK" ]; then
          run_args+=("--sdk=$INPUT_SDK")
        fi

        if [ "$INPUT_FAIL_ON_ERROR" = "false" ]; then
          run_args+=("--no-fail-on-error")
        fi

        comment_file="${RUNNER_TEMP}/lower-bound-comment.md"
        run_args+=("--comment-output=$comment_file")
        if [ "${INPUT_MAX_COMMENT_ROWS:-0}" -gt 0 ]; then
          run_args+=("--max-comment-rows=$INPUT_MAX_COMMENT_ROWS")
        fi

        workspace="${GITHUB_WORKSPACE:-$PWD}"
        pkg_path="$INPUT_PACKAGE_PATH"
        if [ "$pkg_path" = "." ]; then
          pkg_path="$workspace"
        elif [[ "$pkg_path" != /* ]]; then
          pkg_path="$workspace/$pkg_path"
        fi

        run_args+=("$pkg_path")

        # Resolve the tool dependencies inside the action checkout, but
        # execute against the caller workspace.
        (cd "$ACTION_PATH" && dart pub get >/dev/null)
        cd "$workspace"

        # Execute lower_bound CLI and capture exit code
        set +e
        dart run "$ACTION_PATH/bin/lower_bound.dart" "${run_args[@]}"
        exit_code=$?
        set -e

        # If running inside a PR context and GH_TOKEN is present, post or update sticky comment
        if [ -n "$PR_NUMBER" ] && [ -n "$GH_TOKEN" ]; then
          if [ -f "$comment_file" ] && [ -s "$comment_file" ]; then
            echo "Searching for existing lower-bound validation comment on PR #$PR_NUMBER..."

            comment_ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --jq '.[] | select(.body | contains("<!-- lower-bound-comment-marker -->")) | .id')
            comment_id=$(printf '%s\n' "$comment_ids" | head -n 1)

            if [ -n "$comment_id" ]; then
              echo "Updating existing comment (ID: $comment_id)..."
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -F body=@"$comment_file" > /dev/null || true
            else
              echo "Creating new PR comment..."
              gh pr comment "$PR_NUMBER" --body-file "$comment_file" --repo "$GITHUB_REPOSITORY" > /dev/null || true
            fi
          fi
        fi

        exit $exit_code
