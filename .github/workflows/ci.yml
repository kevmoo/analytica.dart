name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 0 * * 0"

env:
  PUB_ENVIRONMENT: bot.github

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [dev]
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - id: install
        name: Install dependencies
        run: dart pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
        if: always() && steps.install.outcome == 'success'
      - name: Analyze code
        run: dart analyze --fatal-infos
        if: always() && steps.install.outcome == 'success'

  test:
    needs: analyze
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        sdk: ['3.12', dev]
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - id: install
        name: Install dependencies
        run: dart pub get
      - name: Run tests (analytica)
        working-directory: packages/analytica
        run: dart test
        if: always() && steps.install.outcome == 'success'
      - name: Run tests (cognitive_complexity)
        working-directory: packages/cognitive_complexity
        run: dart test
        if: always() && steps.install.outcome == 'success'
      - name: Run tests (dedupe)
        working-directory: packages/dedupe
        run: dart test
        if: always() && steps.install.outcome == 'success'
      - name: Run tests (undead)
        working-directory: packages/undead
        run: dart test
        if: always() && steps.install.outcome == 'success'

