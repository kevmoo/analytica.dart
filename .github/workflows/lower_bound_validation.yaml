name: Dependency Lower-Bound Validation

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: Run Lower-Bound Validator
        uses: kevmoo/lower_bound.dart@main
        with:
          allow-local-siblings: 'true'
          format: 'github'
          fail-on-error: 'true'
